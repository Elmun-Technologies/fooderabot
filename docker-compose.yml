version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fooderabot
      POSTGRES_PASSWORD: fooderabot
      POSTGRES_DB: fooderabot
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://fooderabot:fooderabot@db:5432/fooderabot?schema=public
    ports:
      - "3000:3000"

  webapp:
    build:
      context: ./webapp
      args:
        VITE_API_BASE_URL: ${WEBAPP_API_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
